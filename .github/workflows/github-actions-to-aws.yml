name: deploy-by-tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy tag'
        required: true
        default: 'v1.0.0'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Show deployed tag
        run: |
          echo "Deploying tag: ${{ github.event.inputs.tag }}"
          git log --oneline -1
